services:
  oblik:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Задайте APP_PASSWORD у файлі .env}
      # Увімкніть, коли сайт працює через HTTPS:
      # COOKIE_SECURE: "1"
      # TRUST_PROXY: "1"
    volumes:
      - oblik-data:/data
volumes:
  oblik-data:

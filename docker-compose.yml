services:
  oblik:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Пароль першого адміністратора (логін admin); потрібен лише при першому запуску.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD у файлі .env}
      # Увімкніть, коли сайт працює через HTTPS:
      # COOKIE_SECURE: "1"
      # TRUST_PROXY: "1"
    volumes:
      - oblik-data:/data
volumes:
  oblik-data:

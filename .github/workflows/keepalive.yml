# Будить безкоштовний сервіс на Render зранку і підстраховує його «неспання» вдень.
# Основне пінгування робить сам застосунок (див. startKeepalive у server.js), а цей
# розклад потрібен, щоб розбудити його після нічного сну. GitHub може запускати
# розклад із затримкою, це нормально. Час у cron — UTC (06:00–22:59 за Києвом узимку).
name: Keepalive

on:
  schedule:
    - cron: '*/10 4-20 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://oblik-roty-jkfx.onrender.com/api/health

plugins {
    id 'com.android.application'
}

// Адреса вебзастосунку; можна перевизначити: ./gradlew assembleRelease -PappUrl=https://...
def appUrl = project.findProperty('appUrl') ?: 'https://oblik-roty-jkfx.onrender.com'
def versionCodeProp = (project.findProperty('versionCode') ?: '1').toInteger()

android {
    namespace 'ua.skrynya.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.skrynya.app'
        minSdk 24
        targetSdk 35
        versionCode versionCodeProp
        versionName "1.0.${versionCodeProp}"
        buildConfigField 'String', 'APP_URL', "\"${appUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Постійний ключ підпису беремо з секретів GitHub (див. android/README.md).
    // Без нього APK підписується тимчасовим ключем збірки.
    def ks = System.getenv('SIGNING_KEYSTORE')
    signingConfigs {
        release {
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS') ?: 'skrynya'
                keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: System.getenv('SIGNING_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig (ks && file(ks).exists()) ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

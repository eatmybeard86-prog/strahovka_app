# Blueprint для Render: https://render.com/docs/blueprint-spec
# Безкоштовний план: сам застосунок не має постійного диска, тому всі дані
# зберігаються в зовнішній базі PostgreSQL (наприклад, безкоштовна Neon).
services:
  - type: web
    name: oblik-roty
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_LOGIN
        value: admin
      # Рядок підключення до бази (Neon → Connection string).
      - key: DATABASE_URL
        sync: false
      # Пароль першого адміністратора.
      - key: ADMIN_PASSWORD
        sync: false
